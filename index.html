<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Inkubator Monitoring System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  </head>
  <body
    class="bg-[#F4F7FE] font-sans text-gray-800 min-h-screen flex flex-col lg:flex-row"
  >
    <aside
      class="w-full lg:w-64 bg-white p-4 lg:p-6 flex flex-col justify-between shadow-sm"
    >
      <div>
        <div class="flex items-center gap-3 mb-8">
          <div class="bg-amber-100 p-2 rounded-xl text-xl">🪺</div>
          <div>
            <h2 class="font-bold text-lg leading-tight">Inkubator</h2>
            <p class="text-xs text-gray-400">Monitoring System</p>
          </div>
        </div>
        <nav class="space-y-2">
          <a
            href="index.html"
            class="flex items-center gap-3 bg-emerald-50 text-emerald-600 px-4 py-3 rounded-xl font-medium text-sm"
            >📊 Dashboard</a
          >
        </nav>
      </div>
      <div
        class="bg-amber-50 p-4 rounded-2xl text-center border border-amber-100"
      >
        <span class="text-3xl">🐥</span>
        <p class="text-xs font-medium text-amber-800 mt-2">
          Jaga suhu stabil, tetas berhasil! 💚
        </p>
      </div>
    </aside>



    <script>
      // 1. SETUP JAM LIVE
      setInterval(() => {
        document.getElementById("live-clock").innerText =
          new Date().toLocaleTimeString("id-ID");
      }, 1000);

      // 2. SETUP GRAFIK (CHART.JS)
      const ctx = document.getElementById("suhuChart").getContext("2d");
      const suhuChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "Suhu (°C)",
              data: [],
              borderColor: "#10B981",
              backgroundColor: "rgba(16, 185, 129, 0.1)",
              borderWidth: 3,
              fill: true,
              tension: 0.4,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 30, max: 45 } },
        },
      });

      // 3. KONFIGURASI MQTT
      const brokerUrl = "wss://test.mosquitto.org:8081";

      const client = mqtt.connect(brokerUrl);

      const statusMqtt = document.getElementById("status-mqtt");

      client.on("connect", () => {
        statusMqtt.className =
          "bg-emerald-50 text-emerald-600 text-xs font-semibold px-4 py-2 rounded-full flex items-center gap-2";
        statusMqtt.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> MQTT Connected`;
        client.subscribe("inkubator/suhu");
      });

      client.on("offline", () => {
        statusMqtt.className =
          "bg-red-50 text-red-600 text-xs font-semibold px-4 py-2 rounded-full flex items-center gap-2";
        statusMqtt.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> MQTT Disconnected`;
      });

      // 4. LOGIK DATA MASUK (HANYA SUHU, LAMPU, ALARM)
      client.on("message", (topic, message) => {
        if (topic === "inkubator/suhu") {
          try {
            const data = JSON.parse(message.toString());

            // Update ke elemen teks HTML
            document.getElementById("txt-suhu").innerText = data.suhu ?? "--.-";
            const lampu = document.getElementById("txt-lampu");
            const alarm = document.getElementById("txt-alarm");

            const badgeLampu = document.getElementById("badge-lampu");
            const badgeAlarm = document.getElementById("badge-alarm");

            if (data.buzzer == 1) {
              // ALARM AKTIF
              alarm.innerText = "AKTIF";
              alarm.className = "text-2xl font-bold text-red-600";

              badgeAlarm.innerText = "🔔 Bunyi";
              badgeAlarm.className =
                "bg-red-50 text-red-600 text-[10px] font-bold px-3 py-1 rounded-full";

              // LAMPU MATI
              lampu.innerText = "OFF";
              lampu.className = "text-3xl font-bold text-slate-500";

              badgeLampu.innerText = "⚫ Mati";
              badgeLampu.className =
                "bg-slate-100 text-slate-600 text-[10px] font-bold px-3 py-1 rounded-full";
            } else {
              // ALARM NORMAL
              alarm.innerText = "NORMAL";
              alarm.className = "text-2xl font-bold text-emerald-600";

              badgeAlarm.innerText = "✅ Aman";
              badgeAlarm.className =
                "bg-emerald-50 text-emerald-600 text-[10px] font-bold px-3 py-1 rounded-full";

              // LAMPU HIDUP
              lampu.innerText = "ON";
              lampu.className = "text-3xl font-bold text-amber-500";

              badgeLampu.innerText = "💡 Hidup";
              badgeLampu.className =
                "bg-amber-50 text-amber-600 text-[10px] font-bold px-3 py-1 rounded-full";
            }
            document.getElementById("txt-update").innerText =
              new Date().toLocaleTimeString("id-ID");

            // Update Data ke Grafik Line Chart
            const now = new Date().toLocaleTimeString("id-ID", {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
            if (suhuChart.data.labels.length > 10) {
              suhuChart.data.labels.shift();
              suhuChart.data.datasets[0].data.shift();
            }
            suhuChart.data.labels.push(now);
            suhuChart.data.datasets[0].data.push(data.suhu);
            suhuChart.update();
          } catch (e) {
            console.error("Format JSON tidak valid", e);
          }
        }
      });
    </script>
  </body>
</html>
